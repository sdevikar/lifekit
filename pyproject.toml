[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lifekit"
version = "0.1.0"
description = "An active AI thought partner that bridges consuming knowledge and living it."
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "ollama>=0.1.0",  # for local model calls (qwen3.6:latest)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lifekit*"]