[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifekit"
version = "0.1.0"
description = "An active AI thought partner that bridges consuming knowledge and living it."
requires-python = ">=3.10"  # fsrs>=6.0 needs 3.10+
dependencies = [
    "pydantic>=2.0",
    "ollama>=0.1.0",  # for local model calls (qwen3.6:latest)
    "PyMuPDF>=1.24",  # TOC-first chapter splitting
    "chonkie>=0.1.0",  # RecursiveChunker for long-chapter sectioning
    "fsrs>=6.0",  # open-source FSRS spaced repetition (Step 7)
    "mcp<2",  # real MCP stdio server (FastMCP) for the coach tools
    "pypdf>=6.0",  # PDF text extraction fallback in lifekit/store/pdf_ingester.py
    "flask>=3.0",  # Step 13a: localhost feed API server
]

[project.scripts]
lifekit = "lifekit.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lifekit*"]